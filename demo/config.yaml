server:
  host: 127.0.0.1
  port: 8300

pipeline_config_dir: ${VECTORSTEP_DEMO_PIPELINES_DIR}
step_library_dir: ${VECTORSTEP_DEMO_STEPS_DIR}

database:
  url: postgresql+asyncpg://localhost:5432/vectorstep_demo

executors: {}

logging:
  level: INFO
  dir: ${VECTORSTEP_DEMO_LOGS_DIR}

artifacts:
  dir: ${VECTORSTEP_DEMO_ARTIFACTS_DIR}
  retention_days: 7

dedup:
  enabled: true
  window_seconds: 300

calibration:
  n_min: 20
  bin_width: 0.1
  cache_ttl_seconds: 30
