<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Quorate mark: four signal segments (S/V/G/D) form the ring; the mark is only
       complete when all four are present. The tail — the deciding vote — carries
       the Q. -->
  <g stroke-linecap="round" stroke-width="6.5">
    <path d="M20 12.68 A20 20 0 0 1 40 12.68" stroke="#a5b4fc"/>
    <path d="M47.32 20 A20 20 0 0 1 47.32 40" stroke="#818cf8"/>
    <path d="M40 47.32 A20 20 0 0 1 20 47.32" stroke="#6366f1"/>
    <path d="M12.68 40 A20 20 0 0 1 12.68 20" stroke="#4f46e5"/>
    <path d="M45.5 45.5 L54 54" stroke="#22d3ee"/>
  </g>
</svg>
